services:
  whatsapp-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - whatsapp_sessions:/app/sessions
    init: true

volumes:
  whatsapp_sessions: