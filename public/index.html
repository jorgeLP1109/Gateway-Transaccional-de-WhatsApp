<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conectar WhatsApp</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(92vw, 34rem); padding: 2rem; border: 1px solid #8886; border-radius: 1rem; }
      input, button { box-sizing: border-box; width: 100%; padding: .8rem; margin: .35rem 0; }
      img { display: block; width: min(100%, 20rem); margin: 1rem auto; background: white; }
      #status { min-height: 1.5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Conectar WhatsApp</h1>
      <p>Ingresa tu API key. Se usa solo en esta página para consultar el QR.</p>
      <label for="api-key">API key</label>
      <input id="api-key" type="password" autocomplete="off">
      <button id="load" type="button">Consultar estado</button>
      <p id="status" role="status"></p>
      <img id="qr" alt="Código QR de vinculación" hidden>
    </main>
    <script>
      const clientId = decodeURIComponent(location.pathname.split('/').pop());
      const status = document.querySelector('#status');
      const qr = document.querySelector('#qr');
      document.querySelector('#load').addEventListener('click', async () => {
        status.textContent = 'Consultando…';
        qr.hidden = true;
        try {
          const response = await fetch(`/api/v1/instance/qr/${encodeURIComponent(clientId)}`, {
            headers: { 'x-api-key': document.querySelector('#api-key').value },
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
          status.textContent = `Estado: ${data.status}`;
          if (data.qr) {
            qr.src = data.qr;
            qr.hidden = false;
          }
        } catch (error) {
          status.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
